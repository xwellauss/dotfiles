font_family      JetBrainsMonoNL-Regular
bold_font        JetBrainsMonoNL-Bold
italic_font      JetBrainsMonoNL-Italic
bold_italic_font JetBrainsMonoNL-Italic
font_size 12.2

#font_family      GeistMono NFM
#bold_font        GeistMono NFM Bold
#italic_font      GeistMono NFM Medium
#bold_italic_font GeistMono NFM Bold
#font_size 13

#font_family      Iosevka NFM
#bold_font        Iosevka NFM Bold
#italic_font      Iosevka NFM Italic
#bold_italic_font Iosevka NFM Bold Italic
#font_size 14.7

allow_remote_control no

cursor_shape block
shell_integration no-cursor
enable_audio_bell no

open_url_with default
detect_urls yes

remember_window_size  yes
initial_window_width  640
initial_window_height 400

# Color Scheme
cursor #ffffff
cursor_text_color #000000
# Black
color0 #000000
color8 #666666
# Red
color1 #cd3131
color9 #f14c4c
# Green
color2  #0dbc79
color10 #23d18b
# Yellow
color3  #e5e510
color11 #f6f643
# Blue
color4  #2472c8
color12 #3b8eea
# Magenta
color5  #bc3fbc
color13 #d670d6
# Cyan
color6  #11a8cd
color14 #29b8db
# white 
color7  #ffffff
color15 #e4e4e4

foreground #ffffff
background #111111

#background_image /home/techie-guy/Downloads/background1.png
background_image_layout scaled
hide_window_decorations yes

selection_foreground #ffffff
selection_background #264f78


# Tabline styling
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_edge         bottom
active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_template "{index}"


map ctrl+shift+f launch --cwd=current
map ctrl+shift+t launch --type=tab --cwd=current

map ctrl+shift+l resize_window narrower
map ctrl+shift+h resize_window wider
map ctrl+shift+k resize_window taller
map ctrl+shift+j resize_window shorter 3

enabled_layouts tall:bias=70;full_size=1;mirrored=false

map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map ctrl+k neighboring_window up
map ctrl+j neighboring_window down
